function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#f8f7ee';ctx.fillRect(0,0,W,H);
// subtle graph paper
ctx.strokeStyle='#e1e8d5';ctx.lineWidth=2;for(let x=0;x<W;x+=54){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=54){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}

ctx.fillStyle='#c9ed58';ctx.beginPath();ctx.ellipse(570,590,485,540,-.12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#503184';ctx.beginPath();ctx.arc(1000,130,210,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b7dd4a';ctx.beginPath();ctx.arc(70,1030,200,0,Math.PI*2);ctx.fill();

const cx=540,cy=630,rx=448,ry=490;ctx.save();ctx.beginPath();ctx.moveTo(540,140);ctx.bezierCurveTo(800,140,1015,310,988,595);ctx.bezierCurveTo(970,895,770,1125,510,1105);ctx.bezierCurveTo(220,1090,88,900,90,630);ctx.bezierCurveTo(90,365,260,140,540,140);ctx.closePath();ctx.clip();ctx.fillStyle='#d9d5e7';ctx.fillRect(75,125,950,1010);

// graphics atop image
ctx.strokeStyle='#c9ed58';ctx.lineWidth=15;ctx.beginPath();ctx.arc(1020,460,135,0,Math.PI*1.65);ctx.stroke();ctx.fillStyle='#c9ed58';for(let i=0;i<8;i++){ctx.beginPath();ctx.arc(72+(i%3)*42,790+Math.floor(i/3)*44,10,0,Math.PI*2);ctx.fill()}

ctx.fillStyle='#503184';ctx.beginPath();ctx.roundRect(605,24,440,180,40);ctx.fill();

function drawHandHeart(x,y,size,color){ // Matching hand-heart symbols in brand colors
ctx.save();ctx.translate(x,y);ctx.scale(size,size);ctx.strokeStyle=color;ctx.lineWidth=11;ctx.lineCap='round';ctx.lineJoin='round';
