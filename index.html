<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Твой выбор — твоя свобода | Твоё время</title><style>body{margin:0;background:#f3f4ed;font-family:Arial,sans-serif;color:#32254f}main{max-width:560px;margin:auto;padding:22px 16px;text-align:center}h1{font-size:34px;line-height:1.05;margin:15px 0}h1 span{color:#72529d}.sub{font-weight:bold}canvas{display:block;width:100%;max-width:440px;margin:20px auto;border-radius:12px;box-shadow:0 8px 28px #0002;touch-action:none}button,.upload{display:inline-block;border:0;border-radius:12px;background:#64458c;color:white;font-size:16px;font-weight:bold;padding:14px 18px;margin:6px;cursor:pointer}.upload{background:#b9df45;color:#332653}input[type=file]{display:none}.control{margin:12px}input[type=range]{width:80%;accent-color:#64458c}small{color:#666;display:block;margin:15px}</style></head><body><main><div class="sub">Молодёжная политика Пермского муниципального округа · ТВОЁ ВРЕМЯ</div><h1>ТВОЙ ВЫБОР — <span>ТВОЯ СВОБОДА</span></h1><p>Добавь фото, настрой его и сохрани карточку участника акции!</p><label class="upload">📷 Выбрать фото<input id="file" type="file" accept="image/*"></label><canvas id="card" width="1080" height="1350" aria-label="Предпросмотр карточки"></canvas><div class="control">Масштаб фото <input id="zoom" type="range" min="1" max="3" step="0.01" value="1"></div><p>Перемещай фото пальцем или мышью</p><button id="save">⬇ Скачать PNG</button><small>Фото обрабатывается только на твоём устройстве и никуда не отправляется.</small></main><script>
const canvas=document.getElementById('card'),ctx=canvas.getContext('2d'),zoom=document.getElementById('zoom');let img=null,scale=1,dx=0,dy=0,drag=null;const W=1080,H=1350;function draw(){ctx.fillStyle='#c4ed51';ctx.fillRect(0,0,W,H);ctx.fillStyle='#4f367b';ctx.font='bold 58px Arial';ctx.fillText('ТВОЁ ВРЕМЯ',62,100);ctx.font='30px Arial';ctx.fillText('ПЕРМСКИЙ МУНИЦИПАЛЬНЫЙ ОКРУГ',64,148);const x=55,y=205,w=970,h=870;ctx.save();ctx.beginPath();ctx.roundRect(x,y,w,h,28);ctx.clip();ctx.fillStyle='#e7e4ef';ctx.fillRect(x,y,w,h);if(img){const base=Math.max(w/img.width,h/img.height),iw=img.width*base*scale,ih=img.height*base*scale;ctx.drawImage(img,x+(w-iw)/2+dx,y+(h-ih)/2+dy,iw,ih)}else{ctx.fillStyle='#725b94';ctx.textAlign='center';ctx.font='bold 48px Arial';ctx.fillText('ТВОЁ ФОТО ЗДЕСЬ',W/2,625);ctx.textAlign='left'}ctx.restore();ctx.fillStyle='#503579';ctx.fillRect(0,1090,W,260);ctx.fillStyle='#c4ed51';ctx.font='bold 74px Arial';ctx.fillText('ТВОЙ ВЫБОР',55,1183);ctx.fillStyle='#fff';ctx.font='bold 77px Arial';ctx.fillText('ТВОЯ СВОБОДА',55,1273)}draw();document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{img=im;scale=1;dx=dy=0;zoom.value=1;draw();URL.revokeObjectURL(u)};im.src=u};zoom.oninput=()=>{scale=+zoom.value;draw()};canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag||!img)return;const r=canvas.getBoundingClientRect(),k=W/r.width;dx+=(e.clientX-drag.x)*k;dy+=(e.clientY-drag.y)*k;drag={x:e.clientX,y:e.clientY};draw()};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.download='tvoy-vybor-tvoya-svoboda.png';a.href=canvas.toDataURL('image/png');a.click()};
</script></body></html>
